<!DOCTYPE html>
<html lang="en" class="stakeholder-choice-root">
<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
   <title>Welcome | Join</title>
   <link rel="icon" href="./assets/icons/desktop/logoFavicon.svg" type="image/svg+xml" />
   <link rel="stylesheet" href="./styles/standard.css" />
   <link rel="stylesheet" href="./style.css" />
   <link rel="stylesheet" href="./styles/stakeholder.css?v=20260924" />
</head>
<body class="stakeholder-page stakeholder-page--choice">
   <main class="choice-shell">
      <section class="choice-card" aria-labelledby="welcome-title">
         <p class="choice-card__eyebrow">AI-powered Issue Collector</p>
         <h1 id="welcome-title" class="choice-card__title">Welcome to Join</h1>
         <span class="choice-card__line" aria-hidden="true"></span>
         <p class="choice-card__intro">Send a feature request by email and let AI turn it into a structured Join ticket, or log in as a team member.</p>
         <div class="choice-card__actions">
            <div class="choice-card__option">
               <p><img class="choice-card__role-icon" src="./assets/icons/desktop/stakeholder-request.svg" alt="" /> Are you a stakeholder?</p>
               <a class="stakeholder-button stakeholder-button--primary stakeholder-button--compact" href="./templates/stakeholder.html">Create request</a>
            </div>
            <div class="choice-card__option">
               <p><img class="choice-card__role-icon" src="./assets/icons/desktop/team-member.svg" alt="" /> Are you a team member?</p>
               <a class="stakeholder-button stakeholder-button--secondary" href="./templates/login.html">Member log in</a>
            </div>
         </div>
      </section>
   </main>
   <footer class="stakeholder-footer">
      <a href="./templates/privacy-Policy.html?from=welcome">Privacy Policy</a>
      <a href="./templates/legalnotice.html?from=welcome">Legal notice</a>
   </footer>
</body>
</html>
